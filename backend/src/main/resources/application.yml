spring:
  application:
    name: student-manager-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/student_manager}
    username: ${DATABASE_USERNAME:student_manager}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate. This matches
      # the master prompt's rule: "Never rely on Hibernate auto-generating
      # production schema."
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    # In production this MUST be a long random secret injected via the
    # JWT_SECRET environment variable - never committed to source control.
    secret: ${JWT_SECRET:}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    root: INFO
    com.studentmanager: INFO
    org.hibernate.SQL: WARN
